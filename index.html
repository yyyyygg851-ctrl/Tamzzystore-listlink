<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050b18">
<meta name="description" content="TAMZZY STORE - Official Links">
<title>TAMZZY STORE — Official Links</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  overflow-x:hidden;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 50% 0%,#073b8f 0%,#03132e 28%,#02050b 65%);
}

/* BACKGROUND GRID */
body::before{
  content:"";
  position:fixed;
  inset:-100px;
  z-index:-3;
  opacity:.35;
  background-image:
    linear-gradient(rgba(0,132,255,.25) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,132,255,.25) 1px,transparent 1px);
  background-size:45px 45px;
  transform:perspective(500px) rotateX(60deg);
  transform-origin:center bottom;
  animation:gridMove 8s linear infinite;
}

@keyframes gridMove{
  from{
    background-position:0 0,0 0;
  }
  to{
    background-position:0 45px,45px 0;
  }
}

/* GLOW */
.glow{
  position:fixed;
  width:300px;
  height:300px;
  border-radius:50%;
  background:#006eff;
  filter:blur(120px);
  opacity:.18;
  z-index:-2;
  pointer-events:none;
  animation:floatGlow 7s ease-in-out infinite alternate;
}

.glow.one{
  top:5%;
  left:-100px;
}

.glow.two{
  right:-100px;
  bottom:5%;
  animation-delay:2s;
}

@keyframes floatGlow{
  from{
    transform:translate(0,0) scale(1);
  }
  to{
    transform:translate(40px,-30px) scale(1.2);
  }
}

/* LOADER */
#loader{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:#02050b;
  transition:opacity .6s ease,visibility .6s ease;
}

#loader.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.loader-box{
  width:80px;
  height:80px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  font-weight:900;
  color:#fff;
  background:linear-gradient(145deg,#0787ff,#003b91);
  border:4px solid #fff;
  box-shadow:10px 10px 0 #000,0 0 35px #008cff;
  animation:loaderBounce 1.1s ease-in-out infinite alternate;
}

@keyframes loaderBounce{
  from{
    transform:translateY(0) rotate(-3deg);
  }
  to{
    transform:translateY(-12px) rotate(3deg);
  }
}

.loader-title{
  margin-top:25px;
  font-size:22px;
  font-weight:900;
  letter-spacing:3px;
}

.loader-sub{
  margin-top:8px;
  color:#7bbdff;
  font-size:12px;
  letter-spacing:2px;
}

.loading-bar{
  width:180px;
  height:7px;
  margin-top:20px;
  overflow:hidden;
  border:2px solid #fff;
  background:#000;
  box-shadow:5px 5px 0 #000;
}

.loading-bar i{
  display:block;
  width:45%;
  height:100%;
  background:#008cff;
  box-shadow:0 0 15px #008cff;
  animation:load 1.4s ease-in-out infinite;
}

@keyframes load{
  0%{
    transform:translateX(-120%);
  }
  100%{
    transform:translateX(350%);
  }
}

/* MAIN */
main{
  width:min(680px,92%);
  margin:0 auto;
  padding:65px 0 35px;
}

/* PROFILE */
.profile{
  text-align:center;
  animation:profileIn .8s ease both;
}

@keyframes profileIn{
  from{
    opacity:0;
    transform:translateY(25px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.avatar-wrap{
  position:relative;
  width:120px;
  height:120px;
  margin:0 auto 22px;
}

.avatar{
  width:120px;
  height:120px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:65px;
  font-weight:1000;
  color:#fff;
  background:linear-gradient(145deg,#0b9cff,#003b91);
  border:5px solid #fff;
  box-shadow:
    12px 12px 0 #000,
    0 0 35px rgba(0,136,255,.9);
  animation:avatarPulse 2s ease-in-out infinite alternate;
}

@keyframes avatarPulse{
  from{
    box-shadow:
      12px 12px 0 #000,
      0 0 25px rgba(0,136,255,.6);
  }
  to{
    box-shadow:
      12px 12px 0 #000,
      0 0 50px rgba(0,136,255,1);
  }
}

.online{
  position:absolute;
  right:-4px;
  bottom:4px;
  width:25px;
  height:25px;
  border:4px solid #02050b;
  border-radius:50%;
  background:#00eaff;
  box-shadow:0 0 15px #00eaff;
  animation:onlinePulse 1.5s infinite;
}

@keyframes onlinePulse{
  50%{
    transform:scale(1.15);
  }
}

.profile h1{
  font-size:36px;
  font-weight:1000;
  letter-spacing:2px;
  text-shadow:5px 5px 0 #000,0 0 20px #008cff;
}

.profile p{
  margin-top:10px;
  color:#a8d7ff;
  font-size:13px;
  font-weight:700;
  line-height:1.7;
  letter-spacing:1px;
}

/* DIVIDER */
.divider{
  width:100%;
  height:5px;
  margin:35px 0 25px;
  background:#008cff;
  border:2px solid #fff;
  box-shadow:6px 6px 0 #000,0 0 15px #008cff;
}

/* LINKS */
.links{
  display:flex;
  flex-direction:column;
  gap:17px;
}

.link{
  position:relative;
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  text-decoration:none;
  color:#fff;
  background:linear-gradient(100deg,#071a35,#061020);
  border:4px solid #fff;
  box-shadow:
    9px 9px 0 #000,
    0 0 18px rgba(0,132,255,.4);
  transition:
    transform .18s ease,
    box-shadow .18s ease,
    background .18s ease;
  animation:linkIn .7s ease both;
}

.link:nth-child(1){animation-delay:.10s}
.link:nth-child(2){animation-delay:.18s}
.link:nth-child(3){animation-delay:.26s}
.link:nth-child(4){animation-delay:.34s}
.link:nth-child(5){animation-delay:.42s}
.link:nth-child(6){animation-delay:.50s}

@keyframes linkIn{
  from{
    opacity:0;
    transform:translateX(-35px);
  }
  to{
    opacity:1;
    transform:translateX(0);
  }
}

.link::before{
  content:"";
  position:absolute;
  top:0;
  left:-120%;
  width:80%;
  height:100%;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.18),
    transparent
  );
  transform:skewX(-20deg);
  transition:left .55s ease;
}

.link:hover::before{
  left:140%;
}

.link:hover{
  transform:translate(-4px,-4px);
  background:linear-gradient(100deg,#0a2c5b,#07336c);
  box-shadow:
    13px 13px 0 #000,
    0 0 28px rgba(0,140,255,.8);
}

.link:active{
  transform:translate(4px,4px);
  box-shadow:4px 4px 0 #000;
}

.text{
  flex:1;
  text-align:center;
  padding:0 50px;
  font-size:16px;
  font-weight:900;
  letter-spacing:.5px;
}

.arrow{
  position:absolute;
  right:18px;
  font-size:28px;
  font-weight:900;
  color:#00bfff;
  transition:transform .2s ease;
}

.link:hover .arrow{
  transform:translateX(6px);
}

/* FOOTER */
footer{
  margin-top:40px;
  text-align:center;
  color:#5784ad;
  font-size:11px;
  font-weight:700;
  letter-spacing:2px;
}

/* REDUCED MOTION */
@media (prefers-reduced-motion:reduce){
  html{
    scroll-behavior:auto;
  }

  *,
  *::before,
  *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }

  body::before,
  .glow,
  .avatar,
  .online,
  .loader-box,
  .loading-bar i,
  .profile,
  .link{
    animation:none !important;
  }
}

/* MOBILE */
@media(max-width:500px){
  main{
    padding-top:45px;
  }

  .avatar-wrap,
  .avatar{
    width:105px;
    height:105px;
  }

  .avatar{
    font-size:55px;
  }

  .profile h1{
    font-size:28px;
  }

  .profile p{
    font-size:11px;
  }

  .link{
    min-height:66px;
    box-shadow:7px 7px 0 #000;
  }

  .text{
    font-size:14px;
    padding:0 45px;
  }

  .arrow{
    right:14px;
    font-size:23px;
  }
}
</style>

<script>
window.addEventListener("load",function(){

  const loader=document.getElementById("loader");

  const reducedMotion =
